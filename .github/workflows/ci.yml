name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Server - install, typecheck, test, build
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Web - install, typecheck, build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Lint shell scripts
        run: shellcheck -S warning install.sh docker/entrypoint.sh

      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          AIO_DOMAIN=arr.example.com docker compose -f docker-compose.yml -f deploy/caddy/docker-compose.caddy.yml config --quiet
          AIO_DOMAIN=arr.example.com docker compose -f docker-compose.yml -f deploy/traefik/docker-compose.traefik.yml config --quiet

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (smoke test, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: aio-arr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and answers
        run: |
          docker run -d --name aio -p 8080:8080 aio-arr:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/health && break; sleep 1; done
          curl -fsS http://localhost:8080/api/auth/state
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          docker logs aio
