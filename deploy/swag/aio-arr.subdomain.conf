## SWAG (linuxserver/swag): copy to /config/nginx/proxy-confs/aio-arr.subdomain.conf
## Make sure SWAG and aio-arr share a docker network, and that the "arr" subdomain is
## included in SWAG's SUBDOMAINS / wildcard certificate.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name arr.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app aio-arr;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }
}
