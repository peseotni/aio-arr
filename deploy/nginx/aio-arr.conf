# Plain nginx: AIO Arr on its own subdomain. Adjust server_name, certificate paths and upstream.
server {
    listen 80;
    server_name arr.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name arr.example.com;

    ssl_certificate     /etc/letsencrypt/live/arr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arr.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;      # or http://aio-arr:8080 when nginx runs in docker
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # interactive release searches can take a while
        proxy_read_timeout 300s;
        # stream big downloads (files / zipped folders) straight to the browser
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
    }
}
